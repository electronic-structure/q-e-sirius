include:
  - remote: 'https://gitlab.com/cscs-ci/recipes/-/raw/master/templates/v2/.ci-ext.yml'

stages:
  - baseimage
  - build
  - test

build base uenv gh200:
  extends: .uenv-builder-daint-gh200
  stage: baseimage
  timeout: 2h
  variables:
    UENV_NAME: q-e-sirius-gh200
    UENV_RECIPE: .ci/uenv-recipe/
    UENV_VERSION: v1

build q-e-sirius cuda:
  extends: .uenv-runner-daint-gh200
  stage: build
  needs: ["build base uenv gh200"]
  image: q-e-sirius-gh200/v1:$CI_PIPELINE_ID
  artifacts:
    paths:
      - installdir.tar
  variables:
    SPEC: q-e-sirius@develop-ristretto +libxc +openmp
    CUDA_ARCH: 90
    GIT_SUBMODULE_STRATEGY: recursive
  script:
    - |
      #
      git clone --filter=tree:0 $(jq -r .spack.repo /user-environment/meta/configure.json) /dev/shm/spack-clone
      git -C /dev/shm/spack-clone checkout $(jq -r .spack.commit /user-environment/meta/configure.json)
      source /dev/shm/spack-clone/share/spack/setup-env.sh
      bwrap --dev-bind / / --tmpfs ~ -- ./.ci/build-cuda.sh

.run_tests:
  stage: test
  extends: [.uenv-runner-daint-gh200]
  image: q-e-sirius-gh200/v1:$CI_PIPELINE_ID
  needs: ["build q-e-sirius cuda"]
  variables:
    SLURM_GPUS_PER_TASK: 1
    SLURM_CPU_BIND: 'socket'
    SLURM_HINT: nomultithread
    SLURM_WAIT: 0
    SLURM_TIMELIMIT: "30:00"
    USE_MPI: 'YES'
    WITH_UENV_VIEW: 'modules'
.run_tests_baremetal:
  stage: test
  extends: [.baremetal-runner-daint-gh200]
  needs: ["build q-e-sirius cuda"]
  variables:
    UENV_REPO_PATH: /capstor/scratch/cscs/antonk/.uenv-images-ci-daint
    SLURM_GPUS_PER_TASK: 1
    SLURM_CPU_BIND: 'socket'
    SLURM_HINT: nomultithread
    SLURM_WAIT: 0
    SLURM_TIMELIMIT: "30:00"
    USE_MPI: 'YES'

test (PW) CdO:
  extends: .run_tests
  variables:
    OMP_NUM_THREADS: $SLURM_CPUS_PER_TASK
    SIRIUS_PRINT_TIMING: 1
    SLURM_CPUS_PER_TASK: 20
    SLURM_NTASKS: 1
  script:
    - source ./.ci/prepare-run.sh
    - cd ./ci-tests/CdO
    - pw.x -i CdO.in > out.txt
    - |
      source /user-environment/venv/bin/activate
      python3 ../qe_diff.py ref.txt out.txt

test (HP) ZrN:
  extends: .run_tests
  variables:
    OMP_NUM_THREADS: $SLURM_CPUS_PER_TASK
    SIRIUS_PRINT_TIMING: 1
    SLURM_CPUS_PER_TASK: 20
    SLURM_NTASKS: 1
  script:
    - source ./.ci/prepare-run.sh
    - cd ./ci-tests/ZrN
    - pw.x -i scf.in -use_qe_scf
    - hp.x -i hp.in
    - cat NZr.Hubbard_parameters.dat
    - |
      source /user-environment/venv/bin/activate
      python3 ../hp_diff.py hp.ref.yml hp.yml

test (HP) NW parallel:
  extends: .run_tests_baremetal
  variables:
    OMP_NUM_THREADS: $SLURM_CPUS_PER_TASK
    SIRIUS_PRINT_TIMING: 1
    SLURM_CPUS_PER_TASK: 20
    SLURM_NTASKS: 4
  script:
   - source ./.ci/prepare-run.sh
   - cd ./ci-tests/NW
   - uenv --repo=$UENV_REPO_PATH run q-e-sirius-gh200/v1:$CI_PIPELINE_ID -- ./run_parallel.x

