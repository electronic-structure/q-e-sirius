    - export PATH=/dev/shm/spack-install/q-e-sirius-develop-ristretto/bin/:$PATH
    - module load python
    - cd ./ci-tests/Si_koopmans
    - pw.x -i Si.scf.in -use_qe_scf
    - wannier90.x -pp Si
    - pw2wannier90.x -i Si.pw2wann.in
    - wannier90.x Si
    - cat Si.wout
    - wannier90.x -pp Si_emp
    - pw2wannier90.x -i Si_emp.pw2wann.in
    - wannier90.x Si_emp
    - cat Si_emp.wout
    - kcw.x -i Si.kcw-wann2kcw.in
