test (KCW) Si:
  extends: .run_tests
  variables:
    OMP_NUM_THREADS: $SLURM_CPUS_PER_TASK
    SIRIUS_PRINT_TIMING: 1
    SLURM_CPUS_PER_TASK: 20
    SLURM_NTASKS: 1
  script:
    - source ./.ci/prepare-run.sh
    - cd ./ci-tests/Si_koopmans
    - pw.x -i Si.scf.in -use_qe_scf
    - wannier90.x -pp Si
    - pw2wannier90.x -i Si.pw2wann.in
    - wannier90.x Si
    - cat Si.wout
    - wannier90.x -pp Si_emp
    - pw2wannier90.x -i Si_emp.pw2wann.in
    - wannier90.x Si_emp
    - cat Si_emp.wout
    - kcw.x -i Si.kcw-wann2kcw.in
    - kcw.x -i Si.kcw-screen.in
    - |
      source /user-environment/venv/bin/activate
      python3 ../kcw_diff.py kcw.ref.yml kcw.yml


